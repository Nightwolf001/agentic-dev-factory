<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect width="960" height="590" fill="#fff"/>
<text x="40" y="32" font-size="22" font-weight="700" fill="#222">The dev-factory flow</text>
<text x="40" y="52" font-size="12" fill="#555">From task to merged PR: what the factory does, and where people decide.</text>
<rect x="40" y="110" width="190" height="100" rx="8" fill="#EEE6FA" stroke="#6B3FA0"/>
<text x="135" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Plan</text>
<text x="135" y="158" text-anchor="middle" font-size="11" fill="#444">/dev-factory:plan</text>
<text x="135" y="178" text-anchor="middle" font-size="11" fill="#333">Tasks of any size, with</text>
<text x="135" y="192" text-anchor="middle" font-size="11" fill="#333">acceptance criteria and</text>
<text x="135" y="206" text-anchor="middle" font-size="11" fill="#333">blockers</text>
<rect x="260" y="110" width="190" height="100" rx="8" fill="#E3ECFB" stroke="#2F5DA8"/>
<text x="355" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2F5DA8">Queue</text>
<text x="355" y="158" text-anchor="middle" font-size="11" fill="#444">ready</text>
<text x="355" y="178" text-anchor="middle" font-size="11" fill="#333">Labelled, unblocked tasks in</text>
<text x="355" y="192" text-anchor="middle" font-size="11" fill="#333">any tracker</text>
<rect x="480" y="110" width="190" height="100" rx="8" fill="#E3ECFB" stroke="#2F5DA8"/>
<text x="575" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2F5DA8">Claim</text>
<text x="575" y="158" text-anchor="middle" font-size="11" fill="#444">inProgress</text>
<text x="575" y="178" text-anchor="middle" font-size="11" fill="#333">Lint, base branch, worktree,</text>
<text x="575" y="192" text-anchor="middle" font-size="11" fill="#333">environment</text>
<rect x="700" y="110" width="190" height="100" rx="8" fill="#EEE6FA" stroke="#6B3FA0"/>
<text x="795" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Prepare</text>
<text x="795" y="158" text-anchor="middle" font-size="11" fill="#444">optional</text>
<text x="795" y="178" text-anchor="middle" font-size="11" fill="#333">Research or debug when the</text>
<text x="795" y="192" text-anchor="middle" font-size="11" fill="#333">task needs it</text>
<rect x="700" y="270" width="190" height="100" rx="8" fill="#EEE6FA" stroke="#6B3FA0"/>
<text x="795" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Build</text>
<text x="795" y="318" text-anchor="middle" font-size="11" fill="#444">test first</text>
<text x="795" y="338" text-anchor="middle" font-size="11" fill="#333">Smallest change that goes</text>
<text x="795" y="352" text-anchor="middle" font-size="11" fill="#333">green</text>
<rect x="480" y="270" width="190" height="100" rx="8" fill="#EEE6FA" stroke="#6B3FA0"/>
<text x="575" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">QA evidence</text>
<text x="575" y="318" text-anchor="middle" font-size="11" fill="#444">walk and record</text>
<text x="575" y="338" text-anchor="middle" font-size="11" fill="#333">Screenshots tied to this</text>
<text x="575" y="352" text-anchor="middle" font-size="11" fill="#333">commit</text>
<rect x="260" y="270" width="190" height="100" rx="8" fill="#EEE6FA" stroke="#6B3FA0"/>
<text x="355" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Two reviews</text>
<text x="355" y="318" text-anchor="middle" font-size="11" fill="#444">spec, then standards</text>
<text x="355" y="338" text-anchor="middle" font-size="11" fill="#333">Fresh sessions; Critical and</text>
<text x="355" y="352" text-anchor="middle" font-size="11" fill="#333">High findings go back</text>
<rect x="40" y="270" width="190" height="100" rx="8" fill="#E3ECFB" stroke="#2F5DA8"/>
<text x="135" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#2F5DA8">Verify gate</text>
<text x="135" y="318" text-anchor="middle" font-size="11" fill="#444">exact commit</text>
<text x="135" y="338" text-anchor="middle" font-size="11" fill="#333">QA run and both reviews</text>
<text x="135" y="352" text-anchor="middle" font-size="11" fill="#333">match the PR head</text>
<rect x="40" y="430" width="190" height="100" rx="8" fill="#EEE6FA" stroke="#6B3FA0"/>
<text x="135" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Draft PR</text>
<text x="135" y="478" text-anchor="middle" font-size="11" fill="#444">inReview</text>
<text x="135" y="498" text-anchor="middle" font-size="11" fill="#333">Evidence and findings</text>
<text x="135" y="512" text-anchor="middle" font-size="11" fill="#333">attached</text>
<rect x="260" y="430" width="190" height="100" rx="8" fill="#FBE3E3" stroke="#A83232"/>
<text x="355" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#A83232">Review and merge</text>
<text x="355" y="478" text-anchor="middle" font-size="11" fill="#444">a person decides</text>
<text x="355" y="498" text-anchor="middle" font-size="11" fill="#333">Request changes sends it</text>
<text x="355" y="512" text-anchor="middle" font-size="11" fill="#333">back for a fix pass</text>
<rect x="480" y="430" width="190" height="100" rx="8" fill="#FBE3E3" stroke="#A83232"/>
<text x="575" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#A83232">Release and beyond</text>
<text x="575" y="478" text-anchor="middle" font-size="11" fill="#444">reviewed, done</text>
<text x="575" y="498" text-anchor="middle" font-size="11" fill="#333">QA, UAT, release belong to</text>
<text x="575" y="512" text-anchor="middle" font-size="11" fill="#333">people</text>
<rect x="700" y="430" width="190" height="100" rx="8" fill="#EEE6FA" stroke="#6B3FA0"/>
<text x="795" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Weekly improve scan</text>
<text x="795" y="478" text-anchor="middle" font-size="11" fill="#444">optional</text>
<text x="795" y="498" text-anchor="middle" font-size="11" fill="#333">Recurring problems become</text>
<text x="795" y="512" text-anchor="middle" font-size="11" fill="#333">draft PRs to review</text>
<line x1="230" y1="160" x2="260" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="450" y1="160" x2="480" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="670" y1="160" x2="700" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="795" y1="210" x2="795" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="700" y1="320" x2="670" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="480" y1="320" x2="450" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="260" y1="320" x2="230" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="135" y1="370" x2="135" y2="430" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="230" y1="480" x2="260" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="450" y1="480" x2="480" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="670" y1="480" x2="700" y2="480" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M355 270 C355 236 745 236 745 270" fill="none" stroke="#A83232" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="400" y="232" font-size="10" fill="#A83232">findings: fix, QA again, review again (limited rounds)</text>
<path d="M575 110 C575 80 355 80 355 110" fill="none" stroke="#A83232" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="330" y="76" font-size="10" fill="#A83232">stuck or no criteria: factory-blocked; a person answers and removes the label</text>
<rect x="40" y="548" width="12" height="12" rx="2" fill="#EEE6FA" stroke="#6B3FA0"/><text x="58" y="558" font-size="11" fill="#444">AI agent</text>
<rect x="130" y="548" width="12" height="12" rx="2" fill="#E3ECFB" stroke="#2F5DA8"/><text x="148" y="558" font-size="11" fill="#444">automated check</text>
<rect x="260" y="548" width="12" height="12" rx="2" fill="#FBE3E3" stroke="#A83232"/><text x="278" y="558" font-size="11" fill="#444">human gate</text>
<text x="40" y="578" font-size="11" fill="#444">The factory never merges, approves or marks a PR ready. The builder has no tracker or GitHub write tools.</text>
</svg>
